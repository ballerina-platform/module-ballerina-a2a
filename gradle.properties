org.gradle.caching=true

group=io.ballerina.lib
version=0.1.0-SNAPSHOT

ballerinaLangVersion=2201.14.0
ballerinaGradlePluginVersion=4.0.0
releasePluginVersion=3.1.0

# The jballerina-tools distribution the io.ballerina.plugin unpacks ships
# only the lang libraries and ballerina/test; every other standard library
# has to be copied in through the ballerinaStdLibs configuration in
# build.gradle. These are the versions this package resolves against
# distribution 2201.14.0 -- keep them in step with ballerina/Dependencies.toml,
# which is the record of what the build actually resolved. Grouped by
# ballerina-library build level, following the module-ballerina-ai layout.

# Level 01
stdlibIoVersion=1.8.3
stdlibTimeVersion=2.8.4
stdlibUrlVersion=2.6.5

# Level 02
stdlibConstraintVersion=1.7.3
stdlibCryptoVersion=2.13.0
stdlibLogVersion=2.17.2
stdlibOsVersion=1.10.3
stdlibTaskVersion=2.11.4

# Level 03
stdlibCacheVersion=3.10.2
stdlibFileVersion=1.14.0
stdlibMimeVersion=2.12.4
stdlibUuidVersion=1.10.2

# Level 04
stdlibAuthVersion=2.14.1
stdlibDataJsonDataVersion=1.1.7
stdlibJwtVersion=2.15.2
stdlibOAuth2Version=2.15.1

# Level 05
stdlibHttpVersion=2.18.2

# Ballerinax Observer
observeVersion=1.8.0
observeInternalVersion=1.8.0
