[package]
org = "ballerina"
name = "a2a"
version = "@toml.version@"
distribution = "2201.13.5"
license = ["Apache-2.0"]
authors = ["Ballerina"]
keywords = ["a2a", "agent2agent", "agent", "protocol", "client"]
repository = "https://github.com/ballerina-platform/module-ballerina-a2a"

[build-options]
observabilityIncluded = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "a2a-native"
version = "@toml.version@"
path = "../native/build/libs/a2a-native-@project.version@.jar"
