import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - A2A Package'

def packageName = "a2a"
def packageOrg = "ballerina"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")

ballerina {
    packageOrganization = packageOrg
    module = packageName
    testCoverageParam = "--code-coverage --coverage-format=xml"
    langVersion = ballerinaLangVersion
    platform = "java21"
}

// Ballerina.toml's version is generated, not hand-maintained: the template in
// build-config/resources carries an @toml.version@ placeholder, and this task
// substitutes whatever version Gradle is building. Without it the two files
// drift apart silently.
//
// The io.ballerina.plugin also *requires* a task of this name to exist --
// configuration fails with "Could not get unknown property 'updateTomlFiles'"
// otherwise -- so this is not optional scaffolding.
task updateTomlFiles {
    doLast {
        def newConfig = ballerinaTomlFilePlaceHolder.text.replace("@toml.version@", tomlVersion)
        ballerinaTomlFile.text = newConfig
    }
}

// Companion to updateTomlFiles: lands a version bump in the repository rather
// than only in the build output.
//
// The io.ballerina.plugin wires this into the task graph itself -- confirmed
// with `--dry-run`, which lists it under both `build` and `publish`, for a
// -SNAPSHOT and a timestamped version alike. It is harmless in CI, which never
// pushes, and a no-op whenever the toml files are actually unchanged, but a
// local `./gradlew build` that does change them will commit on your branch
// without asking. Pass `-x commitTomlFiles` when building locally.
task commitTomlFiles {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        execHelper.execOperations.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml"
            }
        }
    }
}

// The `publish` task the root maven-publish plugin creates has nothing to
// publish without this: `createArtifactZip` is the io.ballerina.plugin task
// that packs the built bala, and this declares it as the single Maven
// artifact, aimed at this repository's own GitHub Packages feed.
//
// The credentials come from publishUser / publishPAT, which the
// build-timestamp-master and release workflows both set from the
// BALLERINA_BOT secrets. Locally they are unset, so use publishToMavenLocal
// rather than publish.
publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv("publishUser")
                password = System.getenv("publishPAT")
            }
        }
    }
}

// The plugin provides unpackJballerinaTools / unpackStdLibs / copyStdlibs but
// does not wire them into `build` itself. Without this, every task that shells
// out to the distribution fails with
//
//     sh: .../build/jballerina-tools-<version>/bin/bal: No such file or directory
//
// because nothing ever unpacked it. The platform template chains it through
// updateTomlFiles, which runs first, so the distribution is in place before
// anything needs it.
updateTomlFiles.dependsOn copyStdlibs

// The pom has to exist by the end of `build`, since the release workflow runs
// `publish -x test` against an already-built tree. Both publish paths depend
// on `build` so the bala createArtifactZip packs is never stale.
build.dependsOn "generatePomFileForMavenPublication"
publishToMavenLocal.dependsOn build
publish.dependsOn build
