 *
 * This is a trimmed root build.gradle: no native/ Java code and no
 * compiler-plugin submodule exist in this package, so the parts of the
 * real ballerina-platform module template that wire those up are omitted
 * rather than left as dead references. See CONFORMANCE_CHECKLIST.md.
 */

plugins {
    // Provides the `release` task the release-package-template workflow runs
    // as `./gradlew clean release -Prelease.useAutomaticVersion=true`. The
    // spotbugs/shadow/download plugins the platform template also declares are
    // omitted: all three exist to build native Java code, which this package
    // has none of.
    id "net.researchgate.release"
}

allprojects {
    group = project.group
    version = project.version

    // maven-publish supplies the `publish` task. The master-branch build
    // workflow (build-timestamp-master-template.yml) runs `./gradlew publish`
    // to push a timestamped bala to GitHub Packages, and the release workflow
    // runs it again with -PpublishToCentral=true; without this plugin both
    // fail at configuration time with "Task 'publish' not found in root
    // project 'a2a' and its subprojects". jacoco is applied alongside it for
    // the coverage report the same workflow uploads to Codecov.
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'

    // Read by the io.ballerina.plugin at apply time. Without them the plugin
    // fails before it does anything, with "Cannot get property
    // 'timestampedVersionRegex' on extra properties extension as it does not
    // exist". They were lost when this file was trimmed down from the
    // ballerina-platform module template.
    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*$'
    }

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

subprojects {
    configurations {
        jbalTools
        ballerinaStdLibs
    }

    dependencies {
        // The io.ballerina.plugin runs the build through a Ballerina
        // distribution it unpacks under build/jballerina-tools-<version>,
        // rather than whatever `bal` happens to be on PATH. Without this
        // configuration that directory never exists and every plugin task
        // fails with exit 127 -- "command not found" -- naming a bal binary
        // one directory deep in the build output.
        //
        // Resolving it needs ballerina-platform GitHub Packages credentials
        // in packageUser / packagePAT, as the module-creation guide requires.
        jbalTools("org.ballerinalang:jballerina-tools:${ballerinaLangVersion}") {
            transitive = false
        }

        /* Standard libraries.
         *
         * The unpacked distribution carries only the lang libraries and
         * ballerina/test; anything else this package imports -- directly or
         * transitively -- has to be copied into its repository by
         * unpackStdLibs/copyStdlibs, or compilation fails with e.g.
         * "cannot resolve module ballerina/os".
         *
         * http, crypto, time and url are the direct imports; the rest arrive
         * through them. ballerina/Dependencies.toml is the record of what the
         * build actually resolved -- keep this list and the versions in
         * gradle.properties in step with it.
         */
        ballerinaStdLibs "io.ballerina.stdlib:auth-ballerina:${stdlibAuthVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:cache-ballerina:${stdlibCacheVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:constraint-ballerina:${stdlibConstraintVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:crypto-ballerina:${stdlibCryptoVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:file-ballerina:${stdlibFileVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:http-ballerina:${stdlibHttpVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:io-ballerina:${stdlibIoVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:jwt-ballerina:${stdlibJwtVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:log-ballerina:${stdlibLogVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:mime-ballerina:${stdlibMimeVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:oauth2-ballerina:${stdlibOAuth2Version}"
        ballerinaStdLibs "io.ballerina.stdlib:os-ballerina:${stdlibOsVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:task-ballerina:${stdlibTaskVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:time-ballerina:${stdlibTimeVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:url-ballerina:${stdlibUrlVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:uuid-ballerina:${stdlibUuidVersion}"
        ballerinaStdLibs "io.ballerina.lib:data.jsondata-ballerina:${stdlibDataJsonDataVersion}"
        ballerinaStdLibs "io.ballerina.stdlib:observe-ballerina:${observeVersion}"
        ballerinaStdLibs "io.ballerina:observe-ballerina:${observeInternalVersion}"
    }
}

def moduleVersion = project.version.replace("-SNAPSHOT", "")

// Drives the release workflow's `./gradlew clean release`: it bumps
// gradle.properties, tags, and pushes. requireBranch keeps that from running
// anywhere but the release branch the workflow creates.
release {
    failOnPublishNeeded = false

    buildTasks = ["build"]
    failOnSnapshotDependencies = true
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v$version'

    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}

task build {
    dependsOn(':a2a-ballerina:build')
}

task test {
    dependsOn(':a2a-ballerina:test')
}

// Turns a Gradle version into the plain version a Ballerina.toml carries:
// strips the -SNAPSHOT suffix, or the trailing timestamp of a
// timestamped build. Used by the ballerina subproject's updateTomlFiles.
def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}
