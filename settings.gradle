 * package's actual footprint (the native/ module, no compiler plugin).
 *
 * The settings file is used to specify which projects to include in your build.
 *
 * Detailed information about configuring a multi-project build in Gradle can be found
 * in the user manual at https://docs.gradle.org/current/userguide/multi_project_builds.html
 */

pluginManagement {
    plugins {
        id "net.researchgate.release" version "${releasePluginVersion}"
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
    }

    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

// The build workflows pass `--scan`. Without agreeing to the terms here the
// scan is silently dropped ("The Gradle Terms of Use have not been agreed
// to") and every build log carries that notice.
plugins {
    id "com.gradle.develocity" version "3.19.2"
}

rootProject.name = 'a2a'

include ':a2a-ballerina'
include ':a2a-native'

project(':a2a-ballerina').projectDir = file('ballerina')
project(':a2a-native').projectDir = file('native')

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}
